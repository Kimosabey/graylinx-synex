; The test split that keeps the gate off the GPU.
;
; The improvement on the sibling is one line: `addopts`. There, exclusion was a flag you had
; to remember — `pytest -m "not requires_box" --ignore=... --ignore=...` — so the honest run
; was the one nobody typed. Here the offline subset is the DEFAULT, so a bare `pytest` *is*
; the gate, and running the box suite is the explicit act:
;
;     pytest                      the gate. No MySQL, no Postgres, no Redis, no Ollama.
;     pytest -m requires_box      the box suite. Run it on the rented GPU, once a burst.
;     pytest -m ""                everything, if you have all of it running locally.
;
; Note which tests are deliberately NOT marked: the tests *of* the evaluation suite. A gate
; that always passes is worse than no gate, and if the meta-tests need a GPU they will not run.

[pytest]
testpaths = tests
addopts = -m "not requires_box" --strict-markers -q
asyncio_mode = auto

markers =
    requires_box: needs live infrastructure — MySQL, Postgres, Redis, Ollama, or a running back end
