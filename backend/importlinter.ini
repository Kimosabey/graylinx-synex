; Layering contracts for the Synex back end.
;
; Decision D-012. `docs/20-architecture/03-from-thermynx.md` §6 described the containment
; correctly and the direction backwards: it placed the probabilistic layer below services and
; analytics, which a LangGraph orchestrator cannot satisfy — it must call services and read
; analytics. The sibling implementation carries fifteen back-edges and one cycle against that
; rule, in a codebase whose own docstrings state it. An unsatisfiable contract is not a strict
; rule; it is a rule that gets switched off.
;
; So the direction here is api -> agents -> services -> analytics|retrieval -> llm|prompts ->
; db -> domain, and every consequence the chapter wanted survives:
;
;   * the state machine is unit-testable with the GPU off      (contract 2)
;   * everything probabilistic sits in one gateable place      (contract 5)
;   * a prompt change cannot alter a state transition          (contract 2)
;   * analytics and domain stay pure                           (contracts 3 and 4)
;
; Run: `lint-imports` from backend/, or `pytest tests/architecture`.

[importlinter]
root_package = app
include_external_packages = True


; ─── 1. The spine. Nothing below reaches up. ─────────────────────────────────────────────
; `containers` is required whenever `exhaustive` is set, and without it import-linter
; refuses the contract as misconfigured rather than running it. That refusal was invisible
; for the whole life of this repository — see the note in `tests/architecture/`.
;
; With a container declared, the layers are named relative to it, so `app.api` becomes `api`.
;
; `eval` sits above `agents` deliberately. `EV2` scores the answers the agent layer produces
; and calls `app.agents.postcheck`'s six audits rather than restating them, so it has to be
; able to see them — and the reverse must stay impossible. A judge that the thing it judges
; can import is a judge that gets imported, and then adjusted to agree. It sits below `jobs`
; and `api` so a scheduled evaluation run and a future scorecard endpoint can both reach it.
[importlinter:contract:spine]
name = One-way layering
type = layers
containers =
    app
layers =
    api
    jobs
    eval
    agents
    tools
    services
    retrieval : analytics
    llm : prompts
    db
    domain
exhaustive = true
; One recorded exception, and it is recorded rather than silent. `app/prompts/explain.py`
; annotates two functions with `EvidencePack`, which lives in `app.services` — one layer
; above. The import is already guarded by `TYPE_CHECKING` and this module never constructs or
; calls into a pack; it renders one it is handed. grimp resolves type-only imports anyway, so
; the guard alone does not satisfy the contract.
;
; The real fix is to move the pack down to a layer both sides may see, which is a wide change
; touching every producer and consumer of it. `Q77` carries that. Listing it here keeps the
; other 337 dependencies enforced instead of leaving the whole contract broken and ignored —
; which is precisely the failure this file's preamble describes.
ignore_imports =
    app.prompts.explain -> app.services.evidence

exhaustive_ignores =
    config
    errors
    log
    logging_setup
    limiter
    observability
    main
    runtime


; ─── 2. services holds no prompts and makes no model calls. ──────────────────────────────
; "The fault-case service contains no prompts and makes no model calls" becomes a build
; failure instead of a sentence in a document. This is what keeps the case state machine
; testable with the GPU off, and what stops a prompt change altering a state transition.
[importlinter:contract:services_are_deterministic]
name = services is prompt-free and model-free
type = forbidden
source_modules =
    app.services
forbidden_modules =
    app.prompts
    app.llm
    app.agents
    app.tools
    langchain_core
    langchain_ollama
    langgraph


; `allow_indirect_imports` because this contract is about **direct** reach, and always was.
; Without it, `app.jobs -> app.db -> sqlalchemy` is a violation — but that chain is the
; layering working as designed: jobs calls the repository, the repository holds the driver.
; Flagging it makes the contract unsatisfiable, and an unsatisfiable rule is one that gets
; switched off — the exact failure D-012's own preamble warns about.
allow_indirect_imports = True

; ─── 2b. A tool never reaches a model, and never writes to the plant. ────────────────────
; `G4` is the gateway, and this is the half of it a test can enforce. A tool that could call
; a model would let the executor write the final answer — the role table forbids it in prose,
; and this forbids it in the build. A tool that could import a database driver could reach the
; plant directly and bypass `synex_plant_ro`; CONTEXT §13 says no tool issues a control command
; to plant equipment in any phase, and the cheapest way to keep that true is to give tools no
; way to talk to hardware at all.
[importlinter:contract:tools_are_deterministic]
name = tools make no model calls and hold no driver
type = forbidden
source_modules =
    app.tools
forbidden_modules =
    app.prompts
    app.llm
    app.agents
    langchain_core
    langchain_ollama
    langgraph
    sqlalchemy
    asyncpg
    aiomysql
    pgvector


; `allow_indirect_imports` because this contract is about **direct** reach, and always was.
; Without it, `app.jobs -> app.db -> sqlalchemy` is a violation — but that chain is the
; layering working as designed: jobs calls the repository, the repository holds the driver.
; Flagging it makes the contract unsatisfiable, and an unsatisfiable rule is one that gets
; switched off — the exact failure D-012's own preamble warns about.
allow_indirect_imports = True

; ─── 3. analytics is pure. ───────────────────────────────────────────────────────────────
; app.config is forbidden deliberately: a pure function that reads a feature flag is not a
; pure function, and the honesty primitives live here.
[importlinter:contract:analytics_is_pure]
name = analytics is pure functions
type = forbidden
source_modules =
    app.analytics
forbidden_modules =
    app.db
    app.services
    app.retrieval
    app.llm
    app.prompts
    app.agents
    app.api
    app.jobs
    app.config
    sqlalchemy
    asyncpg
    aiomysql
    redis
    httpx
    langchain_core


; `allow_indirect_imports` because this contract is about **direct** reach, and always was.
; Without it, `app.jobs -> app.db -> sqlalchemy` is a violation — but that chain is the
; layering working as designed: jobs calls the repository, the repository holds the driver.
; Flagging it makes the contract unsatisfiable, and an unsatisfiable rule is one that gets
; switched off — the exact failure D-012's own preamble warns about.
allow_indirect_imports = True

; ─── 4. domain is a leaf. ────────────────────────────────────────────────────────────────
; Plant constants and pure rules, importable from anywhere, depending on nothing. This is
; what lets `escalation_target` work with the GPU down.
[importlinter:contract:domain_is_a_leaf]
name = domain imports nothing
type = forbidden
source_modules =
    app.domain
forbidden_modules =
    app.analytics
    app.db
    app.llm
    app.prompts
    app.retrieval
    app.services
    app.agents
    app.api
    app.jobs
    app.config
    sqlalchemy
    httpx
    redis
    langchain_core
    pydantic_settings


; `allow_indirect_imports` because this contract is about **direct** reach, and always was.
; Without it, `app.jobs -> app.db -> sqlalchemy` is a violation — but that chain is the
; layering working as designed: jobs calls the repository, the repository holds the driver.
; Flagging it makes the contract unsatisfiable, and an unsatisfiable rule is one that gets
; switched off — the exact failure D-012's own preamble warns about.
allow_indirect_imports = True

; ─── 5. Exactly one place reaches a model. ───────────────────────────────────────────────
; "Code never names a model." Every call site asks for a role and app.llm resolves it, so
; retiring a model costs one line and the security guarantee never lives in the model choice.
[importlinter:contract:one_model_gateway]
name = only app.llm imports a model client
type = forbidden
source_modules =
    app.api
    app.jobs
    app.services
    app.analytics
    app.retrieval
    app.db
    app.domain
    app.prompts
forbidden_modules =
    langchain_ollama
    langchain_openai
    ollama


; `allow_indirect_imports` because this contract is about **direct** reach, and always was.
; Without it, `app.jobs -> app.db -> sqlalchemy` is a violation — but that chain is the
; layering working as designed: jobs calls the repository, the repository holds the driver.
; Flagging it makes the contract unsatisfiable, and an unsatisfiable rule is one that gets
; switched off — the exact failure D-012's own preamble warns about.
allow_indirect_imports = True

; ─── 6. Exactly one place reaches a database. ────────────────────────────────────────────
; One consequence worth knowing: app.api cannot annotate AsyncSession directly. Re-export the
; type from app.db.session and annotate with that. Mildly annoying, and exactly the discipline
; that keeps the routers thin.
[importlinter:contract:one_db_gateway]
name = only app.db imports a database driver
type = forbidden
source_modules =
    app.api
    app.jobs
    app.agents
    app.services
    app.analytics
    app.retrieval
    app.llm
    app.prompts
    app.domain
forbidden_modules =
    sqlalchemy
    asyncpg
    aiomysql
    pgvector


; `allow_indirect_imports` because this contract is about **direct** reach, and always was.
; Without it, `app.jobs -> app.db -> sqlalchemy` is a violation — but that chain is the
; layering working as designed: jobs calls the repository, the repository holds the driver.
; Flagging it makes the contract unsatisfiable, and an unsatisfiable rule is one that gets
; switched off — the exact failure D-012's own preamble warns about.
allow_indirect_imports = True