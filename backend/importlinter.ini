; Layering contracts for the Synex back end.
;
; Decision D-012. `docs/20-architecture/03-from-thermynx.md` §6 described the containment
; correctly and the direction backwards: it placed the probabilistic layer below services and
; analytics, which a LangGraph orchestrator cannot satisfy — it must call services and read
; analytics. The sibling implementation carries fifteen back-edges and one cycle against that
; rule, in a codebase whose own docstrings state it. An unsatisfiable contract is not a strict
; rule; it is a rule that gets switched off.
;
; So the direction here is api -> agents -> services -> analytics|retrieval -> llm|prompts ->
; db -> domain, and every consequence the chapter wanted survives:
;
;   * the state machine is unit-testable with the GPU off      (contract 2)
;   * everything probabilistic sits in one gateable place      (contract 5)
;   * a prompt change cannot alter a state transition          (contract 2)
;   * analytics and domain stay pure                           (contracts 3 and 4)
;
; Run: `lint-imports` from backend/, or `pytest tests/architecture`.

[importlinter]
root_package = app
include_external_packages = True


; ─── 1. The spine. Nothing below reaches up. ─────────────────────────────────────────────
[importlinter:contract:spine]
name = One-way layering
type = layers
layers =
    app.api
    app.jobs
    app.agents
    app.services
    app.retrieval : app.analytics
    app.llm : app.prompts
    app.db
    app.domain
exhaustive = true
exhaustive_ignores =
    app.config
    app.errors
    app.log
    app.logging_setup
    app.limiter
    app.observability


; ─── 2. services holds no prompts and makes no model calls. ──────────────────────────────
; "The fault-case service contains no prompts and makes no model calls" becomes a build
; failure instead of a sentence in a document. This is what keeps the case state machine
; testable with the GPU off, and what stops a prompt change altering a state transition.
[importlinter:contract:services_are_deterministic]
name = services is prompt-free and model-free
type = forbidden
source_modules =
    app.services
forbidden_modules =
    app.prompts
    app.llm
    app.agents
    langchain_core
    langchain_ollama
    langgraph


; ─── 3. analytics is pure. ───────────────────────────────────────────────────────────────
; app.config is forbidden deliberately: a pure function that reads a feature flag is not a
; pure function, and the honesty primitives live here.
[importlinter:contract:analytics_is_pure]
name = analytics is pure functions
type = forbidden
source_modules =
    app.analytics
forbidden_modules =
    app.db
    app.services
    app.retrieval
    app.llm
    app.prompts
    app.agents
    app.api
    app.jobs
    app.config
    sqlalchemy
    asyncpg
    aiomysql
    redis
    httpx
    langchain_core


; ─── 4. domain is a leaf. ────────────────────────────────────────────────────────────────
; Plant constants and pure rules, importable from anywhere, depending on nothing. This is
; what lets `escalation_target` work with the GPU down.
[importlinter:contract:domain_is_a_leaf]
name = domain imports nothing
type = forbidden
source_modules =
    app.domain
forbidden_modules =
    app.analytics
    app.db
    app.llm
    app.prompts
    app.retrieval
    app.services
    app.agents
    app.api
    app.jobs
    app.config
    sqlalchemy
    httpx
    redis
    langchain_core
    pydantic_settings


; ─── 5. Exactly one place reaches a model. ───────────────────────────────────────────────
; "Code never names a model." Every call site asks for a role and app.llm resolves it, so
; retiring a model costs one line and the security guarantee never lives in the model choice.
[importlinter:contract:one_model_gateway]
name = only app.llm imports a model client
type = forbidden
source_modules =
    app.api
    app.jobs
    app.services
    app.analytics
    app.retrieval
    app.db
    app.domain
    app.prompts
forbidden_modules =
    langchain_ollama
    langchain_openai
    ollama


; ─── 6. Exactly one place reaches a database. ────────────────────────────────────────────
; One consequence worth knowing: app.api cannot annotate AsyncSession directly. Re-export the
; type from app.db.session and annotate with that. Mildly annoying, and exactly the discipline
; that keeps the routers thin.
[importlinter:contract:one_db_gateway]
name = only app.db imports a database driver
type = forbidden
source_modules =
    app.api
    app.jobs
    app.agents
    app.services
    app.analytics
    app.retrieval
    app.llm
    app.prompts
    app.domain
forbidden_modules =
    sqlalchemy
    asyncpg
    aiomysql
    pgvector
